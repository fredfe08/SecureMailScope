[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securemailscope-m1"
version = "1.0.0"
description = "PCAP/network evidence extraction for SecureMailScope"
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0.0"]

[project.scripts]
securemailscope-m1 = "securemailscope_m1.cli:main"
